# Foundry config for SigNoz self-hosted deployment via Docker Compose.
# Deploy with:
#   foundryctl gauge -f casting.yaml   # validate prerequisites
#   foundryctl cast  -f casting.yaml   # generate + start the stack
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
